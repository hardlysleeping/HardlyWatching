[package]
name = "hardlywatching"
version = "0.5.1"
description = "HardlyWatching - desktop shell for the HardlyWatching server"
authors = ["hardlysleeping"]
edition = "2021"
rust-version = "1.77"

# The shell is a window onto a URL. It bundles no copy of the web UI: the UI
# ships inside the Python server, so this crate only resolves a server URL and
# points a WebView at it.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# libc is only used for two things: SIGTERM/SIGKILL on the bundled server we
# spawned, and PR_SET_PDEATHSIG so that child cannot outlive a crashed shell.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Not "abort": GTK/WebKit initialise inside tao's event loop, and a session with
# a broken display makes them panic. Catching that gives the user a readable
# message ("could not open a window on this display") instead of "Aborted (core
# dumped)" -- see run_window() in src/main.rs.
panic = "unwind"
strip = true
