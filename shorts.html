<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#08080c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Shorts</title>
<link rel="manifest" href="/shorts.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  :root{
    --bg:#08080c;
    --fg:#f4f4f6;
    --muted:rgba(244,244,246,.55);
    --accent:#ff8c5a;
    --glass:rgba(20,20,26,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    overscroll-behavior:none}
  body{overflow:hidden}

  /* One clip fills the screen; snaps vertically like a shorts app. */
  #feed{
    height:100%;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #feed::-webkit-scrollbar{display:none}

  .clip{
    position:relative;height:100%;height:100dvh;scroll-snap-align:start;
    scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  .clip video{
    width:100%;height:100%;object-fit:contain;background:#000;
  }
  .clip .pad{
    /* Tapping the middle toggles play; these zones keep the buttons clickable. */
    position:absolute;inset:0;
  }

  /* ---- top bar ---- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:.5rem;
    padding:calc(env(safe-area-inset-top) + .6rem) .8rem .6rem;
    background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
  }
  .topbar .title{font-size:.82rem;font-weight:600;letter-spacing:.02em}
  /* Opened as its own page, the player has no tab strip above it and a
     standalone window has no back button, so give it one. Inside the app's
     Shorts tab the tabs are the way out, so this stays hidden there. */
  .goback{
    position:fixed;z-index:30;left:.7rem;
    top:calc(env(safe-area-inset-top) + .55rem);
    display:none;padding:.42rem .7rem;border-radius:999px;
    font:600 .74rem/1 system-ui,-apple-system,sans-serif;
    color:rgba(255,255,255,.92);text-decoration:none;
    background:rgba(12,12,18,.62);border:1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .goback:hover{background:rgba(12,12,18,.85)}
  /* Only when this is its own page: the embed has tabs right above it. */
  html:not(.embed) .goback{display:inline-block}
  /* Embedded in the main app's Shorts tab: the surrounding page already has a
     tab strip and a heading, so ours would just be a duplicate. */
  .embed .topbar{background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
  .embed .topbar .title{display:none}
  .topbar .count{font-size:.72rem;color:var(--muted);margin-left:auto}
  .filt{
    border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--fg);
    border-radius:999px;padding:.34rem .7rem;font-size:.72rem;letter-spacing:.03em;
  }
  .filt.on{background:var(--accent);border-color:var(--accent);color:#1a0f08}

  .edgeshelf{
    position:fixed;top:0;right:0;bottom:0;width:26px;
    /* Under the rail, so the buttons still take their own clicks. */
    z-index:19;
  }
  /* Nothing can hover here, so the strip must not exist: it would be a silent
     26px band down the right edge that swallows taps. */
  @media (hover: none){ .edgeshelf{display:none} }

  /* ---- right-hand action rail ---- */
  .rail{
    position:fixed;right:.55rem;bottom:calc(env(safe-area-inset-bottom) + 5.4rem);
    z-index:20;display:flex;flex-direction:column;gap:.95rem;align-items:center;
  }
  .act{
    width:3.1rem;height:3.1rem;border-radius:50%;border:none;
    background:var(--glass);backdrop-filter:blur(10px);color:var(--fg);
    font-size:1.28rem;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s ease,background .12s ease;
  }
  .act:active{transform:scale(.9)}
  .act.liked{color:#ff5c8a}
  /* Gold, not the heart's pink: the two are different things and should not read
     as one control in two states. */
  .act.starred{color:#f5c451}
  .act.trashed{color:#ff5c5c}
  .act small{font-size:.55rem;display:block;margin-top:-.15rem}
  .lbl{font-size:.58rem;color:var(--muted);text-align:center;margin-top:.15rem;
    letter-spacing:.05em;text-transform:uppercase}

  /* ---- bottom info ---- */
  .who{
    display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;
    color:inherit;font:inherit;cursor:pointer;max-width:70%;
  }
  .who .pfpwrap{position:relative;width:36px;height:36px;flex:none}
  .who .pfp,.who .pfallback{
    position:absolute;inset:0;width:36px;height:36px;border-radius:50%;
    object-fit:cover;border:1.5px solid rgba(255,255,255,.55);box-sizing:border-box;
  }
  .who .pfallback{
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.16);font-weight:600;text-transform:uppercase;
  }
  .who .wname{
    font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .who:active{opacity:.75}
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:.9rem 1rem calc(env(safe-area-inset-bottom) + .9rem);
    background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
    pointer-events:none;
  }
  .bottombar .who{font-size:.9rem;font-weight:600}
  .bottombar .meta{font-size:.7rem;color:var(--muted);margin-top:.15rem}

  /* ---- icons ----
     One stroke weight and one size for every control. The emoji glyphs this
     replaces rendered at whatever the OS and font felt like -- different
     weights, different baselines, and a colour emoji next to a monochrome one
     is what made the rail look assembled from spare parts. */
  .ic{
    width:1.15rem;height:1.15rem;display:block;flex:none;
    fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .act .ic{width:1.25rem;height:1.25rem}
  .filt .ic{width:1.05rem;height:1.05rem}
  .liked .ic{fill:currentColor}
  .starred .ic{fill:currentColor}
  .filt.on .ic{fill:currentColor}
  /* Sound on shows the waves; muted shows the slash. Both are in the markup so
     a state change is a class, not a rebuilt button. */
  #muteBtn .waves,#muteBtn .slash{transition:opacity .12s ease}
  #muteBtn .waves{opacity:0}
  #muteBtn .slash{opacity:1}
  #muteBtn.on .waves{opacity:1}
  #muteBtn.on .slash{opacity:0}

  /* ---- progress ----
     One job, two shapes. A mouse gets the row: times, a thumb, and skip
     buttons, because a mouse can aim. A finger gets a strip along the bottom
     edge with a 34px band to catch it, because a thumb cannot. Neither pauses
     the clip -- a scrub is a position, not a play/pause. */
  .scrub{
    position:fixed;left:0;right:0;z-index:22;
    bottom:calc(env(safe-area-inset-bottom) + 4.5rem);
    display:flex;align-items:center;gap:.55rem;
    padding:0 1.05rem;pointer-events:auto;
  }
  .scrub .t{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;
    min-width:2.7rem;text-align:center}
  /* Tappable skip controls. On a desktop these are the whole point of the row:
     the bar alone is a fiddly target and the arrow keys have to be remembered.
     Tap one three times to step the jump 5 -> 10 -> 15 -> 5. */
  .skipbtn{
    pointer-events:auto;flex:none;
    background:rgba(10,10,14,.62);color:var(--fg);
    border:1px solid rgba(255,255,255,.18);border-radius:999px;
    padding:.2rem .55rem;font:inherit;font-size:.68rem;
    font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;
  }
  .skipbtn:hover{border-color:rgba(255,255,255,.4)}
  .skipbtn:active{transform:scale(.94)}
  .scrub input{
    pointer-events:auto;flex:1;min-width:0;height:26px;margin:0;padding:0;
    -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;
    touch-action:none;
  }
  .scrub input::-webkit-slider-runnable-track{height:4px;border-radius:999px;
    background:rgba(255,255,255,.3)}
  .scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    margin-top:-5px;border-radius:50%;background:var(--fg);border:none}
  .scrub input::-moz-range-track{height:4px;border-radius:999px;
    background:rgba(255,255,255,.3)}
  .scrub input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:var(--fg);border:none}
  /* Hide the mouse-only control on a touch screen. !important so an inline
     display:"" (used to show it again when the feed loads) cannot override it. */
  @media (pointer:coarse){ .scrub{display:none !important} }

  /* The touch strip. An unaimed thumb anywhere along the bottom seeks, which is
     the one gesture a phone was missing: before this, the only way to move was
     a double tap or a 5s skip button, so a 90s clip could not be moved through
     at all. */
  .tbar{
    position:fixed;left:0;right:0;bottom:0;z-index:23;display:none;
    height:calc(34px + env(safe-area-inset-bottom));
    touch-action:none;cursor:pointer;
  }
  .tbar::before,.tbar i{
    content:"";position:absolute;left:0;bottom:calc(env(safe-area-inset-bottom) + 3px);
    height:3px;border-radius:0 2px 2px 0;
  }
  .tbar::before{right:0;background:rgba(255,255,255,.22)}
  .tbar i{width:0;background:var(--fg);transition:width .1s linear}
  @media (pointer:coarse){ .tbar{display:block} }

  /* ---- feed tuning sheet ----
     What the sampler has learned, read from the server rather than held in the
     page. It was invisible before: pressing "more" showed a toast and left
     nothing behind that could be checked, so the setting looked like it reset
     every session even though it had been saved. */
  .sheet{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .sheet.open{display:block}
  .sheet .card{
    position:absolute;left:0;right:0;bottom:0;max-height:84dvh;
    overflow-y:auto;overscroll-behavior:contain;
    background:#111117;border:1px solid rgba(255,255,255,.08);border-bottom:0;
    border-radius:18px 18px 0 0;
    padding:.4rem 1rem calc(env(safe-area-inset-bottom) + 1.1rem);
  }
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);
    margin:.4rem auto .9rem}
  .sheet h2{font-size:.95rem;margin:0 0 .2rem;font-weight:650}
  .sheet .sub{font-size:.72rem;color:var(--muted);line-height:1.5;margin:0 0 .8rem}
  .wrow{display:flex;align-items:center;gap:.5rem;padding:.45rem 0;
    border-top:1px solid rgba(255,255,255,.06)}
  .wrow .w{min-width:0;flex:1}
  .wrow .nm{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .wrow .mt{font-size:.66rem;color:var(--muted);margin-top:.1rem}
  .wrow .val{font-size:.74rem;font-variant-numeric:tabular-nums;min-width:2.4rem;
    text-align:right;color:var(--accent)}
  .wrow button{
    width:2rem;height:2rem;flex:none;border-radius:50%;
    border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--fg);
    font:inherit;font-size:.9rem;line-height:1;display:flex;align-items:center;
    justify-content:center;cursor:pointer;
  }
  .wrow button:active{transform:scale(.92)}
  .wrow button.zero{width:auto;padding:0 .55rem;border-radius:999px;font-size:.62rem;
    color:var(--muted)}
  .sheet .foot{display:flex;gap:.6rem;margin-top:1rem;padding-top:.9rem;
    border-top:1px solid rgba(255,255,255,.06)}
  .sheet .foot button{
    flex:1;padding:.62rem;border-radius:12px;font:inherit;font-size:.78rem;
    border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--fg);
    cursor:pointer;
  }
  .sheet .foot button.primary{background:var(--accent);border-color:var(--accent);
    color:#1a0f08;font-weight:650}
  .sheet .empty{font-size:.78rem;color:var(--muted);padding:.5rem 0 1rem;line-height:1.6}

  /* Briefly shown over the clip: play/pause on a tap, the seconds skipped on a
     double tap. There is no visible control to move, so without this a tap
     looks like it did nothing. */
  .tapicon{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:25;pointer-events:none;opacity:0;
    font-size:3.4rem;line-height:1;color:#fff;
    text-shadow:0 2px 18px rgba(0,0,0,.75);
    transition:opacity .18s ease;
  }
  .tapicon.show{opacity:.92}

  /* ---- states ---- */
  .msg{
    height:100%;height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:.8rem;padding:2rem;text-align:center;
  }
  .msg h2{font-size:1.05rem;margin:0;font-weight:600}
  .msg p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.6;max-width:26ch}
  .msg a{color:var(--accent);text-decoration:none;font-size:.82rem}
  .spinner{
    width:26px;height:26px;border:2px solid rgba(255,255,255,.18);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 1.4rem);
    transform:translateX(-50%) translateY(20px);opacity:0;
    background:rgba(30,30,38,.95);color:var(--fg);border-radius:999px;
    padding:.5rem .95rem;font-size:.74rem;z-index:40;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="feed"></div>

<a class="goback" id="goback" href="/?tab=gallery">&larr; Gallery</a>

<div class="topbar" id="topbar" style="display:none">
  <span class="title">Shorts</span>
  <button class="filt" id="favBtn" aria-label="Starred only"
          title="Starred only — the clips you have starred">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3.2l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6L3.2 9.6l6.1-.9z"/>
    </svg>
  </button>
  <button class="filt" id="tuneBtn" aria-label="Feed tuning"
          title="Feed tuning — what this feed has learned">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 8h7M15 8h5M4 16h5M13 16h7"/>
      <circle cx="13" cy="8" r="2"/><circle cx="11" cy="16" r="2"/>
    </svg>
  </button>
  <button class="filt" id="fsBtn" aria-label="Fullscreen" title="Fullscreen">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/>
    </svg>
  </button>
  <button class="filt" id="uiToggle" aria-label="Show or hide the controls"
          title="Hide the controls">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
      <circle cx="12" cy="12" r="2.6"/>
    </svg>
  </button>
  <span class="count" id="count"></span>
</div>

<!-- A place to put the cursor, not a thing to look at. On a desktop there is no
     swipe, so running the cursor into the right edge reveals the controls and
     leaving it puts them back -- the same gesture, done with a mouse, and nothing
     permanent sitting over the video. -->
<div class="edgeshelf" id="edgeshelf" aria-hidden="true"></div>

<div class="rail" id="rail" style="display:none">
  <button class="act" id="muteBtn" aria-label="Unmute" title="Sound (m)">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M11 5.5L6.5 9H3.5v6h3L11 18.5z"/>
      <g class="waves"><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.8 6.6a8 8 0 0 1 0 10.8"/></g>
      <g class="slash"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g>
    </svg>
  </button>
  <button class="act" id="likeBtn" aria-label="Like" title="Like (l)">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 20.3l-1.2-1.1C6 15 3 12.3 3 9a4.6 4.6 0 0 1 4.7-4.6A5 5 0 0 1 12 6.3a5 5 0 0 1 4.3-1.9A4.6 4.6 0 0 1 21 9c0 3.3-3 6-7.8 10.2z"/>
    </svg>
  </button>
  <!-- A star is a bookmark, not a reaction: the thing you want to find again.
       It sits apart from the heart on purpose -- neither implies the other. -->
  <button class="act" id="starBtn" aria-label="Star" title="Star — save this one">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3.2l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6L3.2 9.6l6.1-.9z"/>
    </svg>
  </button>
  <button class="act" id="dlBtn" aria-label="Download" title="Save the file to this device">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3.5v11m0 0l-4-4m4 4l4-4M4.5 19.5h15"/>
    </svg>
  </button>
  <button class="act" id="trashBtn" aria-label="Trash" title="Trash — take it out of the feed">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l1 12h9l1-12M10.2 10.8v4.8M13.8 10.8v4.8"/>
    </svg>
  </button>
  <button class="act" id="moreBtn" aria-label="Show more often from this profile"
          title="See more from this profile">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <button class="act" id="lessBtn" aria-label="Show less often from this profile"
          title="See less from this profile">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>

<div class="tapicon" id="tapIcon" aria-hidden="true"></div>

<div class="scrub" id="scrubWrap" style="display:none">
  <button class="skipbtn" id="skipBack" aria-label="Skip back">&#8634;<span id="skipBackN">5</span>s</button>
  <span class="t" id="tCur">0:00</span>
  <input type="range" id="scrub" min="0" max="1000" value="0" step="1"
         aria-label="Seek">
  <span class="t" id="tDur">0:00</span>
  <button class="skipbtn" id="skipFwd" aria-label="Skip forward"><span id="skipFwdN">5</span>s&#8635;</button>
</div>

<div class="bottombar" id="bottombar" style="display:none">
  <!-- Tapping the picture opens that person's gallery. The viewer is an iframe
       with its own document, so the tap is sent up to the app as a message and
       the gallery opens there live -- the sitting is not reloaded, and coming
       back is another tap on the Shorts tab. -->
  <button class="who" id="who" aria-label="Open this profile's gallery"></button>
  <div class="meta" id="meta"></div>
</div>

<div class="toast" id="toast"></div>

<!-- The touch progress strip. A finger anywhere along the bottom edge seeks,
     including the last few millimetres a thumb can actually reach. -->
<div class="tbar" id="tbar" aria-hidden="true"><i id="tbarFill"></i></div>

<!-- What the feed has learned, straight from the server database. -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="card">
    <div class="grab"></div>
    <h2 id="sheetTitle">Feed tuning</h2>
    <p class="sub" id="sheetSub"></p>
    <div id="wlist"></div>
    <div class="foot">
      <button type="button" id="wclose">Done</button>
      <button type="button" id="wreset" class="primary">Reset all</button>
    </div>
  </div>
</div>

<script>
"use strict";

const feed = document.getElementById("feed");
const TOP = 8;            // clips fetched per batch (8, not 4: each batch is a
                          // server round trip and the feed should not stall
                          // every couple of swipes)
const REFILL_AT = 3;      // fetch more when this many remain below the fold
const MAX_EXCLUDE = 400;  // remember this many recently shown, then forget
// How many clips to fetch in advance, and how many to keep loaded behind.
//
// Every clip used to be created with preload="none" and only the one in view was
// told to load, so each swipe started a cold fetch and decode. Getting the next
// couple in while the current one plays is what makes a flick land on a clip that
// is already buffered.
const PRELOAD_AHEAD = 2;
const KEEP_BEHIND = 2;
// Outside this many clips, release the source. Keeping a whole session decoded
// is what makes a phone browser start refusing to play anything.
const RELEASE_AT = 3;
// Seconds a skip jumps. Step through these by tapping either skip button three
// times: 5, then 10, then 15, then back to 5. Starts at the first, and resets on
// reload -- it is part of the sitting, like the scroll position.
const SKIP_STEPS = [5, 10, 15];
const DOUBLE_TAP_MS = 260;// wait this long before a tap counts as a single tap

// Opened inside the main app's Shorts tab (an iframe of /shorts?embed=1) rather
// than standalone: the surrounding page supplies the tabs and title, so ours is
// dropped. Everything else behaves identically in both modes.
const QS = new URLSearchParams(location.search);
if(QS.get("embed") === "1")
  document.documentElement.classList.add("embed");

// Opened from one person's gallery: show only them.
//
// The filter arrives in the URL rather than through postMessage because the whole
// player is an iframe with its own document, and a filter that has to be pushed
// in afterwards is one more thing that can arrive late or not at all. The app
// sets this URL when it opens the tab, and reloads it when the open profile
// changes, so what is on screen and what is filtered cannot disagree.
const ONLY_USER = (QS.get("profile") || "").trim();
const ONLY_PLATFORM = (QS.get("platform") || "").trim().toLowerCase();

let clips = [];           // loaded clips, in feed order
let idx = 0;              // index of the clip in view
let seen = [];            // recently shown, sent back so they are deprioritised
// A session is one sitting: reloading the page starts a new one, and the pool
// is reshuffled so the same handful cannot come up first every time. TikTok
// behaves this way, and it is the whole point of a random feed -- a fixed
// order only looks random once.
// Survives backgrounding, tab switching and the phone suspending the app: all
// of those just pause the page. A force-close wipes sessionStorage, which is
// what should start a new sitting -- not losing focus for a minute.
const SESSION_KEY = "shorts.session.v1";
// The first fetch of a page load bypasses the server's short-lived scan cache,
// so opening the feed always reflects what is on disk right now. Later batches
// (and a scroll-to-top reshuffle) reuse it, because a second full walk of the
// archive per swipe is what made the feed feel slow.
let refreshNext = true;
function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && typeof d === "object") ? d : null;
  }catch(e){ return null; }
}
function saveSession(extra){
  try{
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      seen: seen.slice(-MAX_EXCLUDE),
      starred: !!starredOnly,
      at: Date.now(),
      ...(extra || {}),
    }));
  }catch(e){}
}
let session = 0;
// Clips fetched but not yet placed in the feed. They are shuffled together and
// spliced in ahead of the tail, so a new batch is not simply bolted onto the
// bottom in the order the server happened to return it.
let queue = [];
// The topbar filter is "starred only". A star is a bookmark; a like is a
// reaction. They are separate and one never implies the other.
let starredOnly = false;
let loading = false;

const $ = id => document.getElementById(id);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1600);
}

async function post(path, body){
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// ---- feed building -------------------------------------------------------

function clipEl(c){
  const wrap = document.createElement("div");
  wrap.className = "clip";
  wrap.dataset.path = c.path;

  const v = document.createElement("video");
  v.src = c.url;
  v.playsInline = true;
  v.setAttribute("playsinline", "");
  v.setAttribute("webkit-playsinline", "");
  // Metadata rather than nothing: a clip whose duration is unknown cannot be
  // scrubbed, and setting currentTime on it just queues a seek that stalls the
  // player until the header arrives. The header is a few KB.
  v.preload = "metadata";
  v.loop = true;
  // Muted is required for autoplay: every browser blocks a video with sound
  // from starting on its own, which left every clip sitting paused at 0.00.
  // Sound is opt-in through the mute button in the rail, and the choice carries
  // across clips for the sitting.
  v.muted = !wantSound;
  // Drive the desktop scrub bar from whichever clip is actually in view.
  v.addEventListener("loadedmetadata", () => {
    if(v.closest(".clip") === current()) paintScrub(v);
  });
  v.addEventListener("timeupdate", () => {
    if(v.closest(".clip") === current()) paintScrub(v);
  });
  // Fall back to a poster-free black frame rather than a broken icon.
  wrap.appendChild(v);

  // Tapping the middle plays/pauses. Two taps on the left or right half jump
  // 10s, which is the only way to scrub on a phone: the bar above is
  // desktop-only and the arrow keys need a keyboard. The single-tap action is
  // held until the double-tap window closes, so a skip never also toggles.
  let tapTimer = null;
  wrap.addEventListener("click", e => {
    // A control owns its own clicks. The row, the rail and the strip sit over
    // the clip, and a miss by a few pixels used to land on the video and pause
    // it -- which is exactly what "I tried to scrub and it stopped" was.
    if(e.target.closest(".rail, .topbar, .scrub, .tbar, .bottombar, .sheet")) return;
    if(Date.now() < swipeUntil) return;   // the tail of a swipe, not a tap
    const r = wrap.getBoundingClientRect();
    const dir = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
    if(tapTimer){
      clearTimeout(tapTimer); tapTimer = null;
      seekTo(v.currentTime + dir * skipStep());
      tapIcon((dir < 0 ? "&minus;" : "+") + skipStep() + "s");
      return;
    }
    tapTimer = setTimeout(() => {
      tapTimer = null;
      if(v.paused){ v.play().catch(()=>{}); tapIcon("&#9654;"); }
      else { userPaused = Date.now(); v.pause(); tapIcon("&#10074;&#10074;"); }
    }, DOUBLE_TAP_MS);
  });
  wrap.querySelector("video").addEventListener("error", () => {
    wrap.innerHTML = '<div class="msg"><h2>Cannot play this one</h2>' +
                     '<p>The file may be audio-only or use a codec the browser lacks.</p></div>';
  });
  return wrap;
}

// The controls that sit over the video: the rail down the right edge, the
// account bar along the bottom, and the scrub bar.
//
// They start visible and nothing here hides them on their own. A gesture does,
// and only a gesture: auto-hiding them while a clip plays means reaching for a
// button that has just vanished, and re-showing them on every clip would undo the
// choice a moment later.
let chromeHidden = false;   // the choice: what the controls do at rest
let chromePeek = false;     // the cursor is at the edge: show them anyway

function paintChrome(){
  const hidden = chromeHidden && !chromePeek;
  const d = hidden ? "none" : "";
  for(const id of ["rail", "bottombar", "scrubWrap"]){
    const el = $(id);
    if(el) el.style.display = d;
  }
  const btn = $("uiToggle");
  if(btn){
    btn.title = chromeHidden ? "Show the controls" : "Hide the controls";
    btn.setAttribute("aria-pressed", chromeHidden ? "true" : "false");
  }
}

function showChrome(hidden){
  chromeHidden = !!hidden;
  chromePeek = false;      // a deliberate change cancels any hover
  paintChrome();
}

// Reveal for the duration of a hover, without changing the choice: leaving the
// edge puts them back the way the choice says.
function peekChrome(){
  if(chromePeek || !chromeHidden) return;
  chromePeek = true;
  paintChrome();
}

function unpeekChrome(){
  if(!chromePeek) return;
  chromePeek = false;
  paintChrome();
}

// A desktop has no swipe, so the same two things are offered: a small button in
// the topbar, and the invisible strip down the right edge.
function wireChromeToggle(){
  const btn = $("uiToggle");
  if(btn) btn.onclick = () => showChrome(!chromeHidden);

  const shelf = $("edgeshelf");
  const rail = $("rail");
  if(!shelf) return;
  // Gated on the pointer that arrives, not on a guess about the device. A finger
  // reports "touch", so a phone can never trip this and keeps the swipe alone;
  // the CSS takes the strip out of the layout entirely on hover-less screens, so
  // it cannot swallow a tap there either.
  const byMouse = (fn) => (e) => { if(e.pointerType === "mouse") fn(); };
  shelf.addEventListener("pointerenter", byMouse(peekChrome));
  shelf.addEventListener("pointerleave", byMouse(() => setTimeout(unpeekChrome, 220)));
  if(rail){
    rail.addEventListener("pointerenter", byMouse(peekChrome));
    rail.addEventListener("pointerleave", byMouse(() => setTimeout(unpeekChrome, 220)));
  }
}

// Swipe left or right to show or hide the controls.
//
// Either direction toggles. The rail is on the right edge, which is where a
// thumb already is, and asking for one specific direction on a control that does
// not slide would be a rule to remember rather than a gesture to use.
//
// A vertical drag is left alone: the feed is a scroller, so only a clearly
// horizontal move counts, and the tap that ends a swipe is swallowed so it does
// not also pause the clip.
let swipeFrom = null;
let swipeUntil = 0;

function onSwipeStart(e){
  if(e.touches && e.touches.length === 1){
    const t = e.touches[0];
    swipeFrom = {x: t.clientX, y: t.clientY};
  } else {
    swipeFrom = null;
  }
}

function onSwipeMove(e){
  if(!swipeFrom || !e.touches || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - swipeFrom.x;
  const dy = t.clientY - swipeFrom.y;
  // Horizontal, deliberate, and not a vertical scroll that drifted sideways.
  if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  swipeFrom = null;
  swipeUntil = Date.now() + 450;   // swallow the click this gesture ends with
  showChrome(!chromeHidden);       // also clears any hover-peek
}

// Nothing auto-hides, so the controls are on screen from the first clip.
document.addEventListener("touchstart", onSwipeStart, {passive: true});
document.addEventListener("touchmove", onSwipeMove, {passive: true});
document.addEventListener("touchend", () => { swipeFrom = null; }, {passive: true});

function renderEmpty(message, sub){
  // The Favourites button lives in the topbar. Hiding the bar here would also
  // hide the only way back out of starred-only mode, so with nothing starred yet
  // you would be stuck in an empty screen with no control to leave it. Keep
  // the bar; hide only what has nothing to show (the rail and bottombar).
  $("topbar").style.display = "";
  chromePeek = false;
  $("rail").style.display = "none";
  $("bottombar").style.display = "none";
  $("scrubWrap").style.display = "none";
  $("tbar").style.display = "none";
  $("count").textContent = "";
  feed.innerHTML = '<div class="msg"><h2>' + message + "</h2><p>" + sub + "</p></div>";
}

function renderLoading(){
  feed.innerHTML = '<div class="msg"><div class="spinner"></div><p>Loading…</p></div>';
}

async function fetchMore(){
  if(loading) return;
  loading = true;
  try{
    const r = await post("/api/shorts/feed", {
      limit: TOP,
      starred: starredOnly,
      profile: ONLY_USER,
      platform: ONLY_PLATFORM,
      exclude: seen.slice(-MAX_EXCLUDE),
      // A forced reshuffle should see a clip that was downloaded a moment ago,
      // so it bypasses the server's short-lived scan cache once.
      refresh: refreshNext,
    });
    refreshNext = false;
    const got = r.clips || [];
    if(!got.length && !clips.length){
      renderEmpty(
        ONLY_USER ? `Nothing from @${ONLY_USER}`
          : (starredOnly ? "Nothing starred yet" : "Nothing to show"),
        ONLY_USER
          ? (ONLY_PLATFORM === "instagram"
              ? "This profile has no reels or short videos archived."
              : "This profile has no videos archived yet.")
          : (starredOnly
              ? "Star a few clips and they will appear here."
              : "Download some TikToks first, then come back.")
      );
      return;
    }
    // Shuffle the new batch, then place it. Without this the feed order is
    // just the server's order, which is the same on every load -- exactly the
    // thing that makes a "random" feed feel repetitive.
    queue.push(...shuffle(got.slice()));
    placeQueue();
    $("topbar").style.display = "";
    $("tbar").style.display = "";
    // Respect the gesture: a refill must not pop the controls back on screen
    // after they have been swiped away, or close them while the cursor is at the
    // edge asking for them.
    paintChrome();
    paintMute();
    // Mark the clip now in view straight away. onScrollSettled is otherwise
    // only reachable by scrolling, so the first clip of every session went
    // unrecorded and could come back immediately.
    playCurrent();
    const first = currentData();
    if(first && !seen.includes(first.path)){
      seen.push(first.path);
      saveSession();
    }
    if(!got.length) toast("No more clips for now");
  }catch(e){
    if(!clips.length) renderEmpty("Cannot reach the app", String(e.message || e));
    else toast("Could not load more");
  }finally{
    loading = false;
  }
}

// Fisher-Yates. The server already weights which clips are chosen; this only
// decides the order they arrive in, so it deliberately does not re-weight.
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Put queued clips into the feed. One is inserted immediately after the clip
// in view so swiping forward always moves on; the rest are distributed through
// the unseen tail rather than dumped at the end in batch order.
function placeQueue(){
  if(!queue.length) return;
  // "Loading…" and the empty states are placeholders for the list, not items in
  // it. Leaving one in place put a full screen of message above the first clip,
  // so the feed opened one screen down and could be scrolled back up to it.
  for(const m of feed.querySelectorAll(":scope > .msg")) m.remove();
  const tailStart = clips.length;
  const pending = queue;
  queue = [];
  // Keep what is already loaded on screen: only the unseen part is reordered.
  const tail = clips.slice(tailStart);
  const pool = shuffle(tail.concat(pending));
  clips = clips.slice(0, tailStart).concat(pool);
  // Replace only from `tailStart` on.
  //
  // This called rebuildFeed(), which empties the feed and recreates every clip.
  // Everything already loaded was thrown away and had to be fetched and decoded
  // again -- including the clip in view -- and the list only grows, so each
  // refill cost more than the last. That is why the first few swipes were fine
  // and it got slower the further you went.
  //
  // The clips being replaced are the ones below the clip in view: unseen, no
  // media fetched yet, so dropping their elements costs nothing.
  const els = [...feed.querySelectorAll(".clip")];
  for(let n = tailStart; n < els.length; n++) els[n].remove();
  for(let n = tailStart; n < clips.length; n++) feed.appendChild(clipEl(clips[n]));
}


// Start a fresh session. Used on an explicit reload and when the user scrolls
// back to the top, so the pool is re-drawn instead of continuing a fixed list.
function reshuffle(){
  session++;
  clips = []; queue = []; idx = 0;
  seen = [];                       // a new sitting: nothing is "recent" yet
  feed.innerHTML = "";
  renderLoading();
  fetchMore();
}

// ---- which clip is in view ----------------------------------------------

function current(){
  // The visible clip is the one whose top is closest to the viewport top.
  const kids = [...feed.querySelectorAll(".clip")];
  if(!kids.length) return null;
  const top = feed.scrollTop;
  let best = kids[0], bestD = Infinity;
  for(const k of kids){
    const d = Math.abs(k.offsetTop - top);
    if(d < bestD){ bestD = d; best = k; }
  }
  return best;
}

function currentData(){
  const el = current();
  if(!el) return null;
  return clips.find(c => c.path === el.dataset.path) || null;
}

// Give an element a source and get it fetching, without disturbing a clip that
// is already loaded or playing.
//
// load() is only called when the element has nothing yet: on a clip that is
// mid-playback it would restart it from the beginning.
function prime(v, c){
  if(!v.getAttribute("src")) v.src = c.url;
  v.preload = "auto";
  if(v.readyState === 0){ try{ v.load(); }catch(e){} }
}

function playCurrent(){
  fillRail();
  const els = [...feed.querySelectorAll(".clip")];
  const i = els.indexOf(current());
  els.forEach((el, n) => {
    const v = el.querySelector("video");
    const c = clips[n];
    if(!v || !c) return;
    if(n === i){
      // A clip that was released while scrolled away has no source any more, so
      // it has to be given one before it can play. Nothing used to put it back,
      // which left a dead player if you scrolled up to something you had passed.
      prime(v, c);
      v.play().catch(() => {
        // Refused. With sound on this is the autoplay block (iOS especially),
        // so mute and retry rather than leave the clip frozen at 0:00 -- and
        // let the button show sound is off instead of claiming otherwise.
        if(!v.muted){
          v.muted = true; wantSound = false; paintMute();
          try { sessionStorage.setItem("shorts.sound", "0"); } catch(e){}
          v.play().catch(()=>{});
        }
      });
      return;
    }
    v.pause();
    const d = n - i;
    if(d > 0 && d <= PRELOAD_AHEAD){
      prime(v, c);               // coming up: fetch it now
    } else if(d < 0 && d >= -KEEP_BEHIND){
      prime(v, c);               // just behind: keep it ready for a scroll back
    } else if(Math.abs(d) > RELEASE_AT){
      // Far away in both directions: free the decoder. The source goes but the
      // clip stays in the list, and prime() gives it back when it returns.
      if(v.getAttribute("src")){
        v.removeAttribute("src");
        try{ v.load(); }catch(e){}
      }
    }
  });
}

function fillRail(){
  const c = currentData();
  if(!c) return;
  paintWho(c);
  const mb = c.bytes ? (c.bytes / 1048576).toFixed(1) + " MB" : "";
  $("meta").textContent = [c.platform, mb,
    "shown " + (c.shown || 0) + "×", "weight " + (c.weight ?? 1)]
    .filter(Boolean).join(" · ");
  $("likeBtn").classList.toggle("liked", !!c.liked);
  $("likeBtn").setAttribute("aria-pressed", c.liked ? "true" : "false");
  // The star is its own thing: a clip can be liked, starred, both or neither.
  $("starBtn").classList.toggle("starred", !!c.starred);
  $("starBtn").setAttribute("aria-pressed", c.starred ? "true" : "false");
  $("count").textContent = (idx + 1) + " / " + clips.length
    + (ONLY_USER ? " · only @" + ONLY_USER : "");
}

// ---- desktop scrub bar ---------------------------------------------------
// The feed loops each clip, so there is no "end" to rewind to; the slider is
// the only way back on a desktop where the native controls are hidden.

let scrubbing = false;
// When the play state was last changed by a deliberate tap or key press. A seek
// that lands on an unbuffered range can drop a playing clip into `paused`, and
// resuming it is right -- unless the pause was the user's idea a moment ago.
let userPaused = 0;

function fmtTime(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ":" + String(ss).padStart(2, "0");
}

function paintTbar(v){
  const d = v.duration;
  const fill = $("tbarFill");
  if(!fill) return;
  fill.style.width = (isFinite(d) && d > 0)
    ? (Math.max(0, Math.min(1, v.currentTime / d)) * 100).toFixed(2) + "%"
    : "0%";
}

function paintScrub(v){
  const d = v.duration;
  const known = isFinite(d) && d > 0;
  $("tDur").textContent = known ? fmtTime(d) : "0:00";
  paintTbar(v);
  if(scrubbing) return;                 // the user is holding the thumb
  $("tCur").textContent = fmtTime(v.currentTime);
  if(known) $("scrub").value = String(Math.round(v.currentTime / d * 1000));
}

let tapTimerGlobal = null;

// Brief glyph over the clip so a tap visibly does something. The html argument
// is one of this file's own literals (a play mark, pause bars, or "+10s" and
// "-10s" built from SKIP) -- never anything from the server or a clip's
// metadata, so there is no untrusted content going into innerHTML here.
function tapIcon(html){
  const el = $("tapIcon");
  if(!el) return;
  el.innerHTML = html;
  el.classList.add("show");
  clearTimeout(tapTimerGlobal);
  tapTimerGlobal = setTimeout(() => el.classList.remove("show"), 520);
}

// Sound is off to begin with, because a browser will not autoplay a video with
// sound -- which is what used to leave every clip frozen at 0:00. The choice is
// kept for the sitting, so a clip scrolled into view later is not silent again.
let wantSound = (() => {
  try { return sessionStorage.getItem("shorts.sound") === "1"; } catch(e){ return false; }
})();

// The topbar filter shows the star's own state: filled while you are looking at
// starred clips only.
// The picture and the handle, as one tap target into that person's gallery.
//
// Repainted only when the person changes: the feed plays clips from the same
// account in a row, and re-setting the image would re-fetch it every clip.
function paintWho(c){
  const b = $("who");
  if(!b) return;
  const u = c.profile || "";
  const plat = c.platform || "instagram";
  if(b.dataset.profile === u && b.dataset.platform === plat) return;
  b.dataset.profile = u;
  b.dataset.platform = plat;
  b.title = "Open @" + u + "'s gallery";
  // The initial sits underneath, so a profile with no picture still shows
  // something to tap rather than a broken frame.
  b.innerHTML =
    '<span class="pfpwrap">'
    + '<span class="pfallback">' + (u ? u[0] : "?") + '</span>'
    + '<img class="pfp" alt="" src="/api/profile-pic?profile='
    + encodeURIComponent(u) + '&platform=' + encodeURIComponent(plat) + '"'
    + ' onerror="this.remove()">'
    + '</span>'
    + '<span class="wname">@' + u + '</span>';
}

// Hand the tap to the app if this is embedded, otherwise go there directly --
// the full-screen link and a phone that opened /shorts on its own are not inside
// anything and would otherwise have nowhere to send it.
function openProfile(username, platform){
  if(!username) return;
  const plat = platform || "instagram";
  try {
    if(window.parent && window.parent !== window){
      window.parent.postMessage(
        {type: "hw-open-profile", profile: username, platform: plat},
        location.origin);
      return;
    }
  } catch(e){ /* a parent we cannot talk to: fall through to the plain link */ }
  location.href = "/?tab=gallery&profile=" + encodeURIComponent(username)
    + "&platform=" + encodeURIComponent(plat);
}

function paintFavBtn(){
  const b = $("favBtn");
  if(!b) return;
  b.classList.toggle("on", starredOnly);
  b.setAttribute("aria-pressed", starredOnly ? "true" : "false");
  b.title = starredOnly
    ? "Showing starred only — tap for everything"
    : "Starred only — the clips you have starred";
}

function paintMute(){
  const b = $("muteBtn");
  if(!b) return;
  b.classList.toggle("on", wantSound);
  b.setAttribute("aria-label", wantSound ? "Mute" : "Unmute");
  b.title = wantSound ? "Mute (m)" : "Unmute (m)";
}

function setSound(on){
  wantSound = !!on;
  try { sessionStorage.setItem("shorts.sound", wantSound ? "1" : "0"); } catch(e){}
  for(const v of feed.querySelectorAll("video")){
    v.muted = !wantSound;
    if(wantSound) v.volume = 1;
  }
  paintMute();
}

function toggleSound(){ setSound(!wantSound); }

// Which step a skip uses. Lives for the sitting only: a reload starts at five
// again, which is a legible default rather than a mystery setting carried over
// from weeks ago.
let skipIdx = 0;
function skipStep(){ return SKIP_STEPS[skipIdx]; }

function paintSkip(){
  for(const [id, n] of [["skipBack","skipBackN"], ["skipFwd","skipFwdN"]]){
    const nEl = $(n);
    if(nEl) nEl.textContent = String(skipStep());
    const b = $(id);
    if(b) b.setAttribute("aria-label",
      (id === "skipBack" ? "Skip back " : "Skip forward ") + skipStep() + " seconds" +
      " (tap 3 times to change the step)");
  }
}

// Three taps on either button moves the step on and does NOT skip: cycling the
// setting should not also throw the clip around. Anything short of three is a
// plain skip by the current step, once the third-tap window has passed.
let tapRun = 0, tapRunTimer = null, tapRunDir = 0;

function skipButtonTap(dir){
  if(tapRunDir !== dir){ tapRun = 0; tapRunDir = dir; }
  tapRun++;
  clearTimeout(tapRunTimer);
  if(tapRun >= 3){
    tapRun = 0; tapRunDir = 0;
    skipIdx = (skipIdx + 1) % SKIP_STEPS.length;
    paintSkip();
    tapIcon("&#8635; " + skipStep() + "s");
    return;
  }
  tapRunTimer = setTimeout(() => {
    const n = tapRun;
    tapRun = 0; tapRunDir = 0;
    if(!n) return;
    const v = current() && current().querySelector("video");
    if(!v) return;
    seekTo(v.currentTime + dir * n * skipStep());
    tapIcon((dir < 0 ? "&minus;" : "+") + (n * skipStep()) + "s");
  }, 420);
}

function seekTo(seconds, opts){
  const v = (opts && opts.video) || (current() && current().querySelector("video"));
  if(!v) return;
  const d = v.duration;
  const t = isFinite(d) && d > 0 ? Math.max(0, Math.min(d - 0.05, seconds)) : Math.max(0, seconds);
  const wasPlaying = !v.paused && !v.ended;
  const resume = () => {
    if(!wasPlaying || Date.now() - userPaused < 800) return;
    if(v.paused && !v.ended) v.play().catch(()=>{});
  };
  try{ v.currentTime = t; }catch(e){}
  resume();                       // a clean seek leaves the play state alone
  if(wasPlaying && v.paused){
    // Landed on an unbuffered range: the browser stops until it has the new
    // position. Put the state back once it does, rather than leaving the clip
    // sitting still with no explanation.
    v.addEventListener("seeked", resume, {once:true});
    setTimeout(resume, 260);
  }
  if(!(opts && opts.quiet)) paintScrub(v);
}

// ---- the row (mouse) ----------------------------------------------------
// Dragging is a position, not a play/pause: the state is remembered on
// pointerdown and restored on release, so playback carries on through the drag.

let scrubWasPlaying = false;

function scrubVideo(){
  return current() && current().querySelector("video");
}

function beginScrub(){
  const v = scrubVideo();
  scrubbing = true;
  scrubWasPlaying = !!(v && !v.paused && !v.ended);
}

function endScrub(){
  scrubbing = false;
  const v = scrubVideo();
  if(v && scrubWasPlaying && v.paused && !v.ended){
    if(!userPaused || Date.now() - userPaused > 800) v.play().catch(()=>{});
  }
  scrubWasPlaying = false;
}

$("scrub").addEventListener("pointerdown", beginScrub);
$("scrub").addEventListener("input", () => {
  const v = scrubVideo();
  if(!v) return;
  const d = v.duration;
  if(!(isFinite(d) && d > 0)) return;
  v.currentTime = (Number($("scrub").value) / 1000) * d;
  $("tCur").textContent = fmtTime(v.currentTime);
  paintTbar(v);
  if(scrubWasPlaying && v.paused && !v.ended) v.play().catch(()=>{});
});
$("scrub").addEventListener("change", endScrub);
$("scrub").addEventListener("pointerup", endScrub);
window.addEventListener("pointerup", endScrub);
// The row is a control strip, not part of the video: nothing that starts in it
// should reach the clip and toggle playback.
for(const ev of ["pointerdown", "click"]){
  $("scrubWrap").addEventListener(ev, e => e.stopPropagation());
}

// ---- the strip (thumb) --------------------------------------------------
// An unaimed drag along the bottom edge. Absolute position from the strip's own
// width, so a drag that wanders off the edge keeps tracking instead of jumping.

let tbarDown = false, tbarWasPlaying = false;

function tbarSeek(clientX){
  const v = scrubVideo();
  if(!v) return;
  const d = v.duration;
  if(!(isFinite(d) && d > 0)) return;
  const r = $("tbar").getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (clientX - r.left) / Math.max(1, r.width)));
  v.currentTime = Math.min(Math.max(0, d - 0.05), f * d);
  paintTbar(v);
  if(tbarWasPlaying && v.paused && !v.ended && Date.now() - userPaused > 800)
    v.play().catch(()=>{});
}

$("tbar").addEventListener("pointerdown", e => {
  const v = scrubVideo();
  if(!v) return;
  tbarDown = true;
  tbarWasPlaying = !v.paused && !v.ended;
  try{ $("tbar").setPointerCapture(e.pointerId); }catch(_){}
  tbarSeek(e.clientX);
  e.preventDefault();
});
$("tbar").addEventListener("pointermove", e => {
  if(tbarDown) tbarSeek(e.clientX);
});
const endTbar = () => {
  if(!tbarDown) return;
  tbarDown = false;
  const v = scrubVideo();
  if(v && tbarWasPlaying && v.paused && !v.ended && Date.now() - userPaused > 800)
    v.play().catch(()=>{});
  tbarWasPlaying = false;
};
$("tbar").addEventListener("pointerup", endTbar);
$("tbar").addEventListener("pointercancel", endTbar);

// ---- fullscreen ---------------------------------------------------------
// The phone's own full-screen player comes with a draggable timeline, a volume
// slider and the system's picture-in-picture, all of which are better than
// anything this page can draw in a 390px strip. Hand over to it on request.

function toggleFullscreen(){
  const v = scrubVideo();
  if(!v) return;
  const doc = document;
  const inFs = doc.fullscreenElement || doc.webkitFullscreenElement;
  if(inFs){
    const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
    if(exit){ try{ exit.call(doc); }catch(e){} }
    return;
  }
  if(typeof v.webkitEnterFullscreen === "function"){
    try{ v.webkitEnterFullscreen(); return; }catch(e){ /* fall through */ }
  }
  const ask = v.requestFullscreen || doc.documentElement.requestFullscreen;
  if(ask){
    const target = v.requestFullscreen ? v : doc.documentElement;
    Promise.resolve(ask.call(target)).catch(() => toast("Fullscreen is not available here"));
    return;
  }
  toast("Fullscreen is not available here");
}

// ---- scrolling -----------------------------------------------------------

let scrollTimer = null;
feed.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(onScrollSettled, 90);
}, {passive:true});

function onScrollSettled(){
  // Back at the very top after having moved down: treat it like a refresh and
  // reshuffle, the way TikTok re-draws when you scroll back up. The check for
  // "having moved" stops the first paint of a fresh session reshuffling itself
  // in a loop.
  if(feed.scrollTop <= 4 && idx > 0){
    reshuffle();
    return;
  }
  const c = currentData();
  if(c){
    const i = clips.indexOf(c);
    if(i !== idx){
      idx = i;
      seen.push(c.path);
      if(seen.length > MAX_EXCLUDE) seen = seen.slice(-MAX_EXCLUDE);
      saveSession();
    }
  }
  // Record the clip actually in view, not only when the index changes: on a
  // fresh load idx is already 0, so the first clip would otherwise never be
  // marked as seen and could reappear immediately after a resume.
  const shown = currentData();
  if(shown && !seen.includes(shown.path)){
    seen.push(shown.path);
    if(seen.length > MAX_EXCLUDE) seen = seen.slice(-MAX_EXCLUDE);
    saveSession();
  }
  playCurrent();
  // Keep the feed fed as the user approaches the end.
  if(clips.length - idx <= REFILL_AT) fetchMore();
}

// ---- actions -------------------------------------------------------------

async function act(action, extra){
  const c = currentData();
  if(!c) return;
  try{
    const r = await post("/api/shorts/action", {path: c.path, action, ...(extra || {})});
    return r;
  }catch(e){ toast("Failed: " + e.message); }
}

$("likeBtn").onclick = async () => {
  const c = currentData();
  if(!c) return;
  c.liked = c.liked ? 0 : 1;
  fillRail();
  await act("like", {value: !!c.liked});
};

wireChromeToggle();

$("who").onclick = () => {
  const b = $("who");
  openProfile(b.dataset.profile, b.dataset.platform);
};

$("starBtn").onclick = async () => {
  const c = currentData();
  if(!c) return;
  c.starred = c.starred ? 0 : 1;
  fillRail();
  await act("star", {value: !!c.starred});
};

$("trashBtn").onclick = async () => {
  const c = currentData();
  if(!c) return;
  const el = current();
  const r = await act("trash");
  // The clip is MOVED to the profile's trash folder, so the gallery's All Trash
  // lists it and Restore there brings it back. If the move failed, keep it in
  // the feed rather than pretending it went somewhere.
  if(r && r.ok === false){ toast(r.error || "Could not trash that"); return; }
  el.style.transition = "opacity .18s ease";
  el.style.opacity = "0";
  setTimeout(() => {
    el.remove();
    clips = clips.filter(x => x.path !== c.path);
    if(!clips.length) fetchMore();
    else playCurrent();
  }, 190);
  toast(r && r.moved ? "Trashed — it is in Gallery › 🗑 All Trash" : "Trashed");
};

// "More / less often" is about the PERSON, not the one clip. One video landing
// well means you want more from them, so the server nudges the whole profile
// and every clip from it follows.
$("moreBtn").onclick = async () => {
  const r = await act("more", {target: "profile"});
  if(r && r.weight) toast("More from @" + (r.profile || "this profile") + " (" + r.weight + "×)");
};

$("lessBtn").onclick = async () => {
  const r = await act("less", {target: "profile"});
  if(r && r.weight) toast("Less from @" + (r.profile || "this profile") + " (" + r.weight + "×)");
};

$("dlBtn").onclick = () => {
  const c = currentData();
  if(!c) return;
  const name = String(c.path).split("/").pop();
  // An <a download> click is not safe here. In a browser it opens the save
  // sheet, but in a standalone PWA -- which is how this runs on a phone -- it
  // navigates the window to the video file, and a standalone window has no back
  // button, no tabs and no address bar. The app was gone and the only way out
  // was to force-quit it.
  //
  // So: only hand it to the browser when the click cannot take the page away.
  // `display-mode: standalone` is the reliable test on iOS, and the window is
  // otherwise checked for a back button by whether it was opened by script.
  const standalone = window.matchMedia("(display-mode: standalone)").matches
                  || window.navigator.standalone === true;
  if(standalone){
    // Save by hand, into a new window: the window can be closed, so nothing is
    // trapped, and iOS still offers its share/save sheet for the file.
    const w = window.open(c.url, "_blank");
    if(w){
      toast("Opened in a new window — long-press to save, then close it");
    }else{
      toast("Saving — check Files");
      const a = document.createElement("a");
      a.href = c.url; a.download = name; a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
    }
    return;
  }
  const a = document.createElement("a");
  a.href = c.url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("Saving…");
};

$("favBtn").onclick = () => {
  starredOnly = !starredOnly;
  paintFavBtn();
  // Rebuild from scratch: the pool has changed, so old clips are not valid.
  clips = []; idx = 0; seen = [];
  feed.innerHTML = "";
  renderLoading();
  fetchMore();
};

// ---- feed tuning ---------------------------------------------------------
// The weights are rows in profiles.db, not values in this page. Reading them
// back is what makes that checkable: before this sheet, "more from this person"
// only ever produced a toast, so a saved setting was indistinguishable from one
// that had been forgotten.

function weightLabel(w){
  return "×" + Number(w).toFixed(2).replace(/\.?0+$/, "");
}

function paintWeights(r){
  const rows = (r && r.profiles) || [];
  const st = (r && r.stats) || {};
  const bits = [];
  if(st.total) bits.push(st.total.toLocaleString() + " clips in rotation");
  if(st.liked) bits.push(st.liked + " liked");
  if(st.starred) bits.push(st.starred + " starred");
  $("sheetSub").textContent = (bits.length ? bits.join(" · ") + ". " : "")
    + "Kept on the server, so a reload, a restart or another device picks up "
    + "exactly this. Weight 1 means no opinion.";

  const list = $("wlist");
  list.innerHTML = "";
  if(!rows.length){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Nothing tuned yet. On a clip, the up arrow asks for more of "
      + "that person and the down arrow for less; whatever you press shows up here.";
    list.appendChild(p);
    return;
  }
  const step = Number(r.step) || 1.6, lo = Number(r.min) || 0.1, hi = Number(r.max) || 5;
  for(const it of rows){
    const row = document.createElement("div");
    row.className = "wrow";

    const box = document.createElement("div");
    box.className = "w";
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = "@" + it.profile;
    const mt = document.createElement("div");
    mt.className = "mt";
    const n = Number(it.clips) || 0;
    mt.textContent = (it.platform === "tiktok" ? "TikTok" : "Instagram")
      + " · " + n + (n === 1 ? " clip" : " clips");
    box.append(nm, mt);

    const val = document.createElement("span");
    val.className = "val";
    val.textContent = weightLabel(it.weight);

    const less = document.createElement("button");
    less.type = "button";
    less.textContent = "−";
    less.title = "Show less often";
    less.setAttribute("aria-label", "Show less of @" + it.profile);
    less.onclick = () => saveWeight(it, Math.max(lo, it.weight / step));

    const zero = document.createElement("button");
    zero.type = "button";
    zero.className = "zero";
    zero.textContent = "reset";
    zero.title = "Back to normal";
    zero.onclick = () => resetWeight(it);

    const more = document.createElement("button");
    more.type = "button";
    more.textContent = "+";
    more.title = "Show more often";
    more.setAttribute("aria-label", "Show more of @" + it.profile);
    more.onclick = () => saveWeight(it, Math.min(hi, it.weight * step));

    row.append(box, val, less, zero, more);
    list.appendChild(row);
  }
}

async function openTune(){
  const sheet = $("sheet");
  sheet.classList.add("open");
  $("wlist").innerHTML = '<p class="empty">Reading…</p>';
  try{
    paintWeights(await post("/api/shorts/weights", {op: "list"}));
  }catch(e){
    $("wlist").innerHTML = '<p class="empty">Could not read the feed settings.</p>';
  }
}

function closeTune(){
  $("sheet").classList.remove("open");
}

async function saveWeight(it, w){
  try{
    const r = await post("/api/shorts/weights",
      {op: "set", platform: it.platform, profile: it.profile, weight: w});
    if(r && r.ok) paintWeights(r); else toast("Could not save that");
  }catch(e){ toast("Could not save that"); }
}

async function resetWeight(it){
  try{
    const r = await post("/api/shorts/weights",
      {op: "reset", platform: it.platform, profile: it.profile});
    if(r && r.ok) paintWeights(r); else toast("Could not save that");
  }catch(e){ toast("Could not save that"); }
}

$("tuneBtn").onclick = openTune;
$("fsBtn").onclick = toggleFullscreen;
$("wclose").onclick = closeTune;
$("sheet").addEventListener("click", e => {
  // The backdrop closes; the card does not.
  if(e.target === $("sheet")) closeTune();
});
$("wreset").onclick = async () => {
  if(!confirm("Forget every favour and damp? The clips stay; only the weighting goes."))
    return;
  try{
    const r = await post("/api/shorts/weights", {op: "reset"});
    if(r && r.ok){
      paintWeights(r);
      toast((r.cleared ? r.cleared + " cleared" : "Nothing to reset"));
    }else toast("Could not reset that");
  }catch(e){ toast("Could not reset that"); }
};

// ---- keyboard ------------------------------------------------------------

document.addEventListener("keydown", e => {
  if(e.key === "ArrowDown" || e.key === "j"){
    e.preventDefault();
    feed.scrollBy({top: window.innerHeight, behavior: "smooth"});
  }else if(e.key === "ArrowUp" || e.key === "k"){
    e.preventDefault();
    feed.scrollBy({top: -window.innerHeight, behavior: "smooth"});
  }else if(e.key === "ArrowLeft"){
    // Rewind 5s. The clip loops, so without this there is no way back on a
    // desktop once the native controls are out of the way.
    e.preventDefault();
    const v = current() && current().querySelector("video");
    if(v) seekTo(v.currentTime - skipStep());
  }else if(e.key === "ArrowRight"){
    e.preventDefault();
    const v = current() && current().querySelector("video");
    if(v) seekTo(v.currentTime + skipStep());
  }else if(e.key === " "){
    e.preventDefault();
    const v = current()?.querySelector("video");
    if(v){ if(v.paused) v.play().catch(()=>{}); else { userPaused = Date.now(); v.pause(); } }
  }else if(e.key === "Escape"){
    if($("sheet").classList.contains("open")){ e.preventDefault(); closeTune(); }
  }else if(e.key === "m"){
    // Same as the rail's mute button, which is the phone's only way in.
    e.preventDefault();
    toggleSound();
  }else if(e.key === "l"){ $("likeBtn").click(); }
  else if(e.key === "f"){ $("favBtn").click(); }
});

// ---- boot ----------------------------------------------------------------

// Resume the sitting if there is one. Backgrounding the app, switching tabs or
// the phone sleeping all keep this; only a force-close clears sessionStorage.
const restored = loadSession();
if(restored){
  seen = Array.isArray(restored.seen) ? restored.seen : [];
  // saveSession() writes `starred`; this used to read `starredOnly`, so the
  // starred filter was remembered nowhere and came back off on every resuming.
  starredOnly = !!restored.starred;
  paintFavBtn();
}
paintMute();
paintSkip();
const _skipBack = $("skipBack");
const _skipFwd  = $("skipFwd");
if(_skipBack) _skipBack.addEventListener("click", () => skipButtonTap(-1));
if(_skipFwd)  _skipFwd.addEventListener("click",  () => skipButtonTap(1));
const _muteBtn = $("muteBtn");
if(_muteBtn) _muteBtn.addEventListener("click", toggleSound);
renderLoading();
fetchMore();

// Keep the sitting up to date, so what was shown is not immediately shown
// again after the page resumes.
setInterval(() => saveSession(), 5000);
window.addEventListener("pagehide", () => saveSession());
document.addEventListener("visibilitychange", () => {
  // Do not reload anything on being hidden: leaving the tab is not a new
  // session, and re-fetching here is what made the feed jump around.
  if(document.visibilityState === "hidden") saveSession();
});
</script>
</body>
</html>
