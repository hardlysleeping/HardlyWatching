<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#08080c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Shorts</title>
<link rel="manifest" href="/shorts.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>" />
<style>
  :root{
    --bg:#08080c;
    --fg:#f4f4f6;
    --muted:rgba(244,244,246,.55);
    --accent:#ff8c5a;
    --glass:rgba(20,20,26,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    overscroll-behavior:none}
  body{overflow:hidden}

  /* One clip fills the screen; snaps vertically like a shorts app. */
  #feed{
    height:100%;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #feed::-webkit-scrollbar{display:none}

  .clip{
    position:relative;height:100%;height:100dvh;scroll-snap-align:start;
    scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  .clip video{
    width:100%;height:100%;object-fit:contain;background:#000;
  }
  .clip .pad{
    /* Tapping the middle toggles play; these zones keep the buttons clickable. */
    position:absolute;inset:0;
  }

  /* ---- top bar ---- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:.5rem;
    padding:calc(env(safe-area-inset-top) + .6rem) .8rem .6rem;
    background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
  }
  .topbar .title{font-size:.82rem;font-weight:600;letter-spacing:.02em}
  /* Embedded in the main app's Shorts tab: the surrounding page already has a
     tab strip and a heading, so ours would just be a duplicate. */
  .embed .topbar{background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
  .embed .topbar .title{display:none}
  .topbar .count{font-size:.72rem;color:var(--muted);margin-left:auto}
  .filt{
    border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--fg);
    border-radius:999px;padding:.34rem .7rem;font-size:.72rem;letter-spacing:.03em;
  }
  .filt.on{background:var(--accent);border-color:var(--accent);color:#1a0f08}

  /* ---- right-hand action rail ---- */
  .rail{
    position:fixed;right:.55rem;bottom:calc(env(safe-area-inset-bottom) + 5.4rem);
    z-index:20;display:flex;flex-direction:column;gap:.95rem;align-items:center;
  }
  .act{
    width:3.1rem;height:3.1rem;border-radius:50%;border:none;
    background:var(--glass);backdrop-filter:blur(10px);color:var(--fg);
    font-size:1.28rem;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s ease,background .12s ease;
  }
  .act:active{transform:scale(.9)}
  .act.liked{color:#ff5c8a}
  .act.trashed{color:#ff5c5c}
  .act small{font-size:.55rem;display:block;margin-top:-.15rem}
  .lbl{font-size:.58rem;color:var(--muted);text-align:center;margin-top:.15rem;
    letter-spacing:.05em;text-transform:uppercase}

  /* ---- bottom info ---- */
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:.9rem 1rem calc(env(safe-area-inset-bottom) + .9rem);
    background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
    pointer-events:none;
  }
  .bottombar .who{font-size:.9rem;font-weight:600}
  .bottombar .meta{font-size:.7rem;color:var(--muted);margin-top:.15rem}

  /* ---- scrub bar ----
     Desktop-only: a touch device already has the video's own controls, and a
     thin slider under a thumb is worse than useless there. On a mouse it is
     the only way to rewind, so it is always there. */
  .scrub{
    position:fixed;left:0;right:0;z-index:22;
    bottom:calc(env(safe-area-inset-bottom) + 4.5rem);
    display:flex;align-items:center;gap:.55rem;
    padding:0 1.05rem;pointer-events:none;
  }
  .scrub .t{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;
    min-width:2.7rem;text-align:center}
  .scrub input{
    pointer-events:auto;flex:1;min-width:0;height:18px;margin:0;padding:0;
    -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;
  }
  .scrub input::-webkit-slider-runnable-track{height:4px;border-radius:999px;
    background:rgba(255,255,255,.3)}
  .scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    margin-top:-5px;border-radius:50%;background:var(--fg);border:none}
  .scrub input::-moz-range-track{height:4px;border-radius:999px;
    background:rgba(255,255,255,.3)}
  .scrub input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:var(--fg);border:none}
  /* Hide the mouse-only control on a touch screen. !important so an inline
     display:"" (used to show it again when the feed loads) cannot override it. */
  @media (pointer:coarse){ .scrub{display:none !important} }

  /* ---- states ---- */
  .msg{
    height:100%;height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:.8rem;padding:2rem;text-align:center;
  }
  .msg h2{font-size:1.05rem;margin:0;font-weight:600}
  .msg p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.6;max-width:26ch}
  .msg a{color:var(--accent);text-decoration:none;font-size:.82rem}
  .spinner{
    width:26px;height:26px;border:2px solid rgba(255,255,255,.18);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 1.4rem);
    transform:translateX(-50%) translateY(20px);opacity:0;
    background:rgba(30,30,38,.95);color:var(--fg);border-radius:999px;
    padding:.5rem .95rem;font-size:.74rem;z-index:40;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="feed"></div>

<div class="topbar" id="topbar" style="display:none">
  <span class="title">Shorts</span>
  <button class="filt" id="favBtn">Favourites</button>
  <span class="count" id="count"></span>
</div>

<div class="rail" id="rail" style="display:none">
  <div>
    <button class="act" id="likeBtn" aria-label="Like">&#9825;</button>
    <div class="lbl">like</div>
  </div>
  <div>
    <button class="act" id="dlBtn" aria-label="Download">&#8595;</button>
    <div class="lbl">save</div>
  </div>
  <div>
    <button class="act" id="trashBtn" aria-label="Trash">&#128465;</button>
    <div class="lbl">trash</div>
  </div>
  <div>
    <button class="act" id="moreBtn" aria-label="Show more often from this profile"
            title="See more from this profile">&#8679;</button>
    <div class="lbl">more</div>
  </div>
  <div>
    <button class="act" id="lessBtn" aria-label="Show less often from this profile"
            title="See less from this profile">&#8681;</button>
    <div class="lbl">less</div>
  </div>
</div>

<div class="scrub" id="scrubWrap" style="display:none">
  <span class="t" id="tCur">0:00</span>
  <input type="range" id="scrub" min="0" max="1000" value="0" step="1"
         aria-label="Seek">
  <span class="t" id="tDur">0:00</span>
</div>

<div class="bottombar" id="bottombar" style="display:none">
  <div class="who" id="who"></div>
  <div class="meta" id="meta"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const feed = document.getElementById("feed");
const TOP = 8;            // clips fetched per batch (8, not 4: each batch is a
                          // server round trip and the feed should not stall
                          // every couple of swipes)
const REFILL_AT = 3;      // fetch more when this many remain below the fold
const MAX_EXCLUDE = 400;  // remember this many recently shown, then forget

// Opened inside the main app's Shorts tab (an iframe of /shorts?embed=1) rather
// than standalone: the surrounding page supplies the tabs and title, so ours is
// dropped. Everything else behaves identically in both modes.
if(new URLSearchParams(location.search).get("embed") === "1")
  document.documentElement.classList.add("embed");

let clips = [];           // loaded clips, in feed order
let idx = 0;              // index of the clip in view
let seen = [];            // recently shown, sent back so they are deprioritised
// A session is one sitting: reloading the page starts a new one, and the pool
// is reshuffled so the same handful cannot come up first every time. TikTok
// behaves this way, and it is the whole point of a random feed -- a fixed
// order only looks random once.
// Survives backgrounding, tab switching and the phone suspending the app: all
// of those just pause the page. A force-close wipes sessionStorage, which is
// what should start a new sitting -- not losing focus for a minute.
const SESSION_KEY = "shorts.session.v1";
// The first fetch of a page load bypasses the server's short-lived scan cache,
// so opening the feed always reflects what is on disk right now. Later batches
// (and a scroll-to-top reshuffle) reuse it, because a second full walk of the
// archive per swipe is what made the feed feel slow.
let refreshNext = true;
function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && typeof d === "object") ? d : null;
  }catch(e){ return null; }
}
function saveSession(extra){
  try{
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      seen: seen.slice(-MAX_EXCLUDE),
      favourites: !!favourites,
      at: Date.now(),
      ...(extra || {}),
    }));
  }catch(e){}
}
let session = 0;
// Clips fetched but not yet placed in the feed. They are shuffled together and
// spliced in ahead of the tail, so a new batch is not simply bolted onto the
// bottom in the order the server happened to return it.
let queue = [];
let favourites = false;
let loading = false;

const $ = id => document.getElementById(id);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1600);
}

async function post(path, body){
  const r = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// ---- feed building -------------------------------------------------------

function clipEl(c){
  const wrap = document.createElement("div");
  wrap.className = "clip";
  wrap.dataset.path = c.path;

  const v = document.createElement("video");
  v.src = c.url;
  v.playsInline = true;
  v.preload = "none";
  v.loop = true;
  // Muted is required for autoplay: every browser blocks a video with sound
  // from starting on its own, which left every clip sitting paused at 0.00.
  // Sound is opt-in through the tap-to-unmute control.
  v.muted = true;
  // Drive the desktop scrub bar from whichever clip is actually in view.
  v.addEventListener("loadedmetadata", () => {
    if(v.closest(".clip") === current()) paintScrub(v);
  });
  v.addEventListener("timeupdate", () => {
    if(v.closest(".clip") === current()) paintScrub(v);
  });
  // Fall back to a poster-free black frame rather than a broken icon.
  wrap.appendChild(v);

  // Tapping the middle plays/pauses; the rail handles its own clicks.
  wrap.addEventListener("click", e => {
    if(e.target.closest(".rail") || e.target.closest(".topbar")) return;
    if(v.paused) v.play().catch(()=>{}); else v.pause();
  });
  wrap.querySelector("video").addEventListener("error", () => {
    wrap.innerHTML = '<div class="msg"><h2>Cannot play this one</h2>' +
                     '<p>The file may be audio-only or use a codec the browser lacks.</p></div>';
  });
  return wrap;
}

function renderEmpty(message, sub){
  // The Favourites button lives in the topbar. Hiding the bar here would also
  // hide the only way back out of Favourites mode, so with no favourites yet
  // you would be stuck in an empty screen with no control to leave it. Keep
  // the bar; hide only what has nothing to show (the rail and bottombar).
  $("topbar").style.display = "";
  $("rail").style.display = "none";
  $("bottombar").style.display = "none";
  $("scrubWrap").style.display = "none";
  $("count").textContent = "";
  feed.innerHTML = '<div class="msg"><h2>' + message + "</h2><p>" + sub + "</p></div>";
}

function renderLoading(){
  feed.innerHTML = '<div class="msg"><div class="spinner"></div><p>Loading…</p></div>';
}

async function fetchMore(){
  if(loading) return;
  loading = true;
  try{
    const r = await post("/api/shorts/feed", {
      limit: TOP,
      favourites,
      exclude: seen.slice(-MAX_EXCLUDE),
      // A forced reshuffle should see a clip that was downloaded a moment ago,
      // so it bypasses the server's short-lived scan cache once.
      refresh: refreshNext,
    });
    refreshNext = false;
    const got = r.clips || [];
    if(!got.length && !clips.length){
      renderEmpty(
        favourites ? "No favourites yet" : "Nothing to show",
        favourites
          ? "Like a few clips and they will appear here."
          : "Download some TikToks first, then come back."
      );
      return;
    }
    // Shuffle the new batch, then place it. Without this the feed order is
    // just the server's order, which is the same on every load -- exactly the
    // thing that makes a "random" feed feel repetitive.
    queue.push(...shuffle(got.slice()));
    placeQueue();
    $("topbar").style.display = "";
    $("rail").style.display = "";
    $("bottombar").style.display = "";
    $("scrubWrap").style.display = "";
    // Mark the clip now in view straight away. onScrollSettled is otherwise
    // only reachable by scrolling, so the first clip of every session went
    // unrecorded and could come back immediately.
    playCurrent();
    const first = currentData();
    if(first && !seen.includes(first.path)){
      seen.push(first.path);
      saveSession();
    }
    if(!got.length) toast("No more clips for now");
  }catch(e){
    if(!clips.length) renderEmpty("Cannot reach the app", String(e.message || e));
    else toast("Could not load more");
  }finally{
    loading = false;
  }
}

// Fisher-Yates. The server already weights which clips are chosen; this only
// decides the order they arrive in, so it deliberately does not re-weight.
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Put queued clips into the feed. One is inserted immediately after the clip
// in view so swiping forward always moves on; the rest are distributed through
// the unseen tail rather than dumped at the end in batch order.
function placeQueue(){
  if(!queue.length) return;
  const tailStart = clips.length;
  const pending = queue;
  queue = [];
  // Keep what is already loaded on screen: only the unseen part is reordered.
  const tail = clips.slice(tailStart);
  const pool = shuffle(tail.concat(pending));
  clips = clips.slice(0, tailStart).concat(pool);
  rebuildFeed();
}

// The feed DOM is rebuilt from `clips`, preserving the clip currently in view so
// a reshuffle never yanks the video out from under the user.
function rebuildFeed(){
  const cur = currentData();
  const keep = cur ? cur.path : null;
  feed.innerHTML = "";
  for(const c of clips) feed.appendChild(clipEl(c));
  if(keep){
    const el = [...feed.querySelectorAll(".clip")].find(k => k.dataset.path === keep);
    if(el){
      feed.scrollTop = el.offsetTop;
      idx = clips.indexOf(cur);
    }
  }
  playCurrent();
}

// Start a fresh session. Used on an explicit reload and when the user scrolls
// back to the top, so the pool is re-drawn instead of continuing a fixed list.
function reshuffle(){
  session++;
  clips = []; queue = []; idx = 0;
  seen = [];                       // a new sitting: nothing is "recent" yet
  feed.innerHTML = "";
  renderLoading();
  fetchMore();
}

// ---- which clip is in view ----------------------------------------------

function current(){
  // The visible clip is the one whose top is closest to the viewport top.
  const kids = [...feed.querySelectorAll(".clip")];
  if(!kids.length) return null;
  const top = feed.scrollTop;
  let best = kids[0], bestD = Infinity;
  for(const k of kids){
    const d = Math.abs(k.offsetTop - top);
    if(d < bestD){ bestD = d; best = k; }
  }
  return best;
}

function currentData(){
  const el = current();
  if(!el) return null;
  return clips.find(c => c.path === el.dataset.path) || null;
}

function playCurrent(){
  fillRail();
  for(const v of feed.querySelectorAll("video")){
    if(v.closest(".clip") === current()){
      v.play().catch(()=>{});
      if(v.preload === "none") v.preload = "auto";
    }else{
      v.pause();
      // Free memory on a long scroll: unload clips far from view.
      if(Math.abs(v.closest(".clip").offsetTop - feed.scrollTop) > window.innerHeight * 3)
        v.removeAttribute("src");
    }
  }
}

function fillRail(){
  const c = currentData();
  if(!c) return;
  $("who").textContent = "@" + (c.profile || "");
  const mb = c.bytes ? (c.bytes / 1048576).toFixed(1) + " MB" : "";
  $("meta").textContent = [c.platform, mb,
    "shown " + (c.shown || 0) + "×", "weight " + (c.weight ?? 1)]
    .filter(Boolean).join(" · ");
  $("likeBtn").classList.toggle("liked", !!c.liked);
  $("likeBtn").innerHTML = c.liked ? "&#9829;" : "&#9825;";
  $("count").textContent = (idx + 1) + " / " + clips.length;
}

// ---- desktop scrub bar ---------------------------------------------------
// The feed loops each clip, so there is no "end" to rewind to; the slider is
// the only way back on a desktop where the native controls are hidden.

let scrubbing = false;

function fmtTime(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ":" + String(ss).padStart(2, "0");
}

function paintScrub(v){
  const d = v.duration;
  const known = isFinite(d) && d > 0;
  $("tDur").textContent = known ? fmtTime(d) : "0:00";
  if(scrubbing) return;                 // the user is holding the thumb
  $("tCur").textContent = fmtTime(v.currentTime);
  if(known) $("scrub").value = String(Math.round(v.currentTime / d * 1000));
}

function seekTo(seconds){
  const v = current() && current().querySelector("video");
  if(!v) return;
  const d = v.duration;
  const t = isFinite(d) && d > 0 ? Math.max(0, Math.min(d - 0.05, seconds)) : Math.max(0, seconds);
  try{ v.currentTime = t; }catch(e){}
  paintScrub(v);
}

$("scrub").addEventListener("pointerdown", () => { scrubbing = true; });
$("scrub").addEventListener("input", () => {
  const v = current() && current().querySelector("video");
  if(!v) return;
  const d = v.duration;
  if(!(isFinite(d) && d > 0)) return;
  v.currentTime = (Number($("scrub").value) / 1000) * d;
  $("tCur").textContent = fmtTime(v.currentTime);
});
const endScrub = () => { scrubbing = false; };
$("scrub").addEventListener("change", endScrub);
window.addEventListener("pointerup", endScrub);

// ---- scrolling -----------------------------------------------------------

let scrollTimer = null;
feed.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(onScrollSettled, 90);
}, {passive:true});

function onScrollSettled(){
  // Back at the very top after having moved down: treat it like a refresh and
  // reshuffle, the way TikTok re-draws when you scroll back up. The check for
  // "having moved" stops the first paint of a fresh session reshuffling itself
  // in a loop.
  if(feed.scrollTop <= 4 && idx > 0){
    reshuffle();
    return;
  }
  const c = currentData();
  if(c){
    const i = clips.indexOf(c);
    if(i !== idx){
      idx = i;
      seen.push(c.path);
      if(seen.length > MAX_EXCLUDE) seen = seen.slice(-MAX_EXCLUDE);
      saveSession();
    }
  }
  // Record the clip actually in view, not only when the index changes: on a
  // fresh load idx is already 0, so the first clip would otherwise never be
  // marked as seen and could reappear immediately after a resume.
  const shown = currentData();
  if(shown && !seen.includes(shown.path)){
    seen.push(shown.path);
    if(seen.length > MAX_EXCLUDE) seen = seen.slice(-MAX_EXCLUDE);
    saveSession();
  }
  playCurrent();
  // Keep the feed fed as the user approaches the end.
  if(clips.length - idx <= REFILL_AT) fetchMore();
}

// ---- actions -------------------------------------------------------------

async function act(action, extra){
  const c = currentData();
  if(!c) return;
  try{
    const r = await post("/api/shorts/action", {path: c.path, action, ...(extra || {})});
    return r;
  }catch(e){ toast("Failed: " + e.message); }
}

$("likeBtn").onclick = async () => {
  const c = currentData();
  if(!c) return;
  c.liked = c.liked ? 0 : 1;
  fillRail();
  await act("like", {value: !!c.liked});
};

$("trashBtn").onclick = async () => {
  const c = currentData();
  if(!c) return;
  const el = current();
  await act("trash");
  // Drop it from this feed immediately; the file stays on disk.
  el.style.transition = "opacity .18s ease";
  el.style.opacity = "0";
  setTimeout(() => {
    el.remove();
    clips = clips.filter(x => x.path !== c.path);
    if(!clips.length) fetchMore();
    else playCurrent();
  }, 190);
  toast("Trashed");
};

// "More / less often" is about the PERSON, not the one clip. One video landing
// well means you want more from them, so the server nudges the whole profile
// and every clip from it follows.
$("moreBtn").onclick = async () => {
  const r = await act("more", {target: "profile"});
  if(r && r.weight) toast("More from @" + (r.profile || "this profile") + " (" + r.weight + "×)");
};

$("lessBtn").onclick = async () => {
  const r = await act("less", {target: "profile"});
  if(r && r.weight) toast("Less from @" + (r.profile || "this profile") + " (" + r.weight + "×)");
};

$("dlBtn").onclick = () => {
  const c = currentData();
  if(!c) return;
  // Straight to the file; the browser handles the save dialog.
  const a = document.createElement("a");
  a.href = c.url;
  a.download = String(c.path).split("/").pop();
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("Saving…");
};

$("favBtn").onclick = () => {
  favourites = !favourites;
  $("favBtn").classList.toggle("on", favourites);
  // Rebuild from scratch: the pool has changed, so old clips are not valid.
  clips = []; idx = 0; seen = [];
  feed.innerHTML = "";
  renderLoading();
  fetchMore();
};

// ---- keyboard ------------------------------------------------------------

document.addEventListener("keydown", e => {
  if(e.key === "ArrowDown" || e.key === "j"){
    e.preventDefault();
    feed.scrollBy({top: window.innerHeight, behavior: "smooth"});
  }else if(e.key === "ArrowUp" || e.key === "k"){
    e.preventDefault();
    feed.scrollBy({top: -window.innerHeight, behavior: "smooth"});
  }else if(e.key === "ArrowLeft"){
    // Rewind 5s. The clip loops, so without this there is no way back on a
    // desktop once the native controls are out of the way.
    e.preventDefault();
    const v = current() && current().querySelector("video");
    if(v) seekTo(v.currentTime - 5);
  }else if(e.key === "ArrowRight"){
    e.preventDefault();
    const v = current() && current().querySelector("video");
    if(v) seekTo(v.currentTime + 5);
  }else if(e.key === " "){
    e.preventDefault();
    const v = current()?.querySelector("video");
    if(v){ v.paused ? v.play().catch(()=>{}) : v.pause(); }
  }else if(e.key === "l"){ $("likeBtn").click(); }
  else if(e.key === "f"){ $("favBtn").click(); }
});

// ---- boot ----------------------------------------------------------------

// Resume the sitting if there is one. Backgrounding the app, switching tabs or
// the phone sleeping all keep this; only a force-close clears sessionStorage.
const restored = loadSession();
if(restored){
  seen = Array.isArray(restored.seen) ? restored.seen : [];
  favourites = !!restored.favourites;
  $("favBtn").classList.toggle("on", favourites);
}
renderLoading();
fetchMore();

// Keep the sitting up to date, so what was shown is not immediately shown
// again after the page resumes.
setInterval(() => saveSession(), 5000);
window.addEventListener("pagehide", () => saveSession());
document.addEventListener("visibilitychange", () => {
  // Do not reload anything on being hidden: leaving the tab is not a new
  // session, and re-fetching here is what made the feed jump around.
  if(document.visibilityState === "hidden") saveSession();
});
</script>
</body>
</html>
